services:
  # ─────────────────────────────────────────────
  # Friday Agent (one-shot query)
  #   docker compose run --rm friday-agent -m "Hello"
  # ─────────────────────────────────────────────
  friday-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-agent
    profiles:
      - agent
    volumes:
      - ./config/config.json:/root/.friday/config.json:ro
      - friday-workspace:/root/.friday/workspace
    entrypoint: ["friday", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # Friday Gateway (Long-running Bot)
  #   docker compose up friday-gateway
  # ─────────────────────────────────────────────
  friday-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: friday-gateway
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ./config/config.json:/root/.friday/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - friday-workspace:/root/.friday/workspace
    command: ["gateway"]

volumes:
  friday-workspace:
